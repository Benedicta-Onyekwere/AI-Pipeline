<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEP Data Review Table</title>
    <!-- The ?v=2 at the end forces the browser to load the new Dark Theme -->
    <link rel="stylesheet" href="style.css?v=2">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>
    <div class="container-fluid">
        <header>
            <h1>MEP Review Table</h1>
            <p>Approve or Reject MEP profiles from the scraped data.</p>
        </header>

        <div class="actions">
            <input type="text" id="searchInput" placeholder="Search by name, country, or party...">
            <button id="exportBtn" class="btn-primary">Export Approved MEPs</button>
        </div>

        <div class="table-container">
            <table id="mepTable">
                <thead>
                    <tr>
                        <th style="width: 200px;">Name</th>
                        <th>Country</th>
                        <th>Political Group</th>
                        <th>National Party</th>
                        <th>Committee Role</th>
                        <th>Role</th>
                        <th>Social Links</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="mepTableBody">
                    <!-- Data will be injected here -->
                </tbody>
            </table>
        </div>

        <div id="loading">Loading MEP data...</div>
    </div>
    <script src="app.js?v=2"></script>
</body>
</html>
