<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSanctions Review Tool</title>
    <link rel="stylesheet" href="style.css">
    <!-- PapaParse is used to read CSV files in the browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>OpenSanctions Results Review</h1>
            <p>Review the potential matches below and approve or reject them.</p>
        </header>

        <div class="actions">
            <input type="text" id="searchInput" placeholder="Search by name or topic...">
            <button id="exportBtn" class="btn-primary">Export Reviewed CSV</button>
        </div>

        <div class="table-container">
            <table id="resultsTable">
                <thead>
                    <tr>
                        <th>Status</th>
                        <th>Name</th>
                        <th>Score</th>
                        <th>Type</th>
                        <th>Topics</th>
                        <th>ID</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="resultsTableBody">
                    <!-- Results will be loaded here -->
                </tbody>
            </table>
        </div>

        <div id="loading">Loading data...</div>
    </div>
    <script src="app.js"></script>
</body>
</html>
